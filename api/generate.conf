sync_enabled: true
sync:
  url: "https://raw.githubusercontent.com/open-meteo/open-meteo/refs/heads/main/openapi/forecast.yml"
  file: "forecast.yml"
oapi_enabled: true
oapi:
  spec_file: "forecast.yml"
  opts_file: "oapi-codegen.yaml"
  code_file: "api.gen.go"
client_enabled: true
client:
  base_pkg: "github.com/tdrn-org/go-open-meteo/api"
  client_type: "github.com/tdrn-org/go-open-meteo/api.ClientWithResponsesInterface"
  wrapper_type: "github.com/tdrn-org/go-open-meteo/openmeteo.Client"
  wrapper_file: "../client.gen.go"
mock_enabled: true
mock:
  base_pkg: "github.com/tdrn-org/go-open-meteo/api"
  service_type: "github.com/tdrn-org/go-open-meteo/api.StrictServerInterface"
  mock_type: "github.com/tdrn-org/go-open-meteo/mock.Server"
  mock_file: "../mock/mock.gen.go"